services:
    telegram-bot-api:
      container_name: telegram-bot-api
      image: aiogram/telegram-bot-api:latest
      profiles: ["local-api"]
      environment:
        TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
        TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
        TELEGRAM_STAT: "${TELEGRAM_STAT:-1}"
        TELEGRAM_VERBOSITY: "${TELEGRAM_VERBOSITY:-0}"
      volumes:
        - "${TG_DATA_PATH:-./data/telegram}:/var/lib/telegram-bot-api"
      restart: unless-stopped
      networks:
        - telegram-net

    applemusic-bot:
      container_name: applemusic-bot
      build:
        context: .
        dockerfile: Dockerfile
      image: local/applemusic_tg_bot:latest
      hostname: tgbot
      depends_on:
        telegram-bot-api:
          condition: service_started
          required: false
      user: "1000:1000"
      env_file:
        - .env
      environment:
        DOWNLOADER__GAMDL__COOKIES_PATH: "${DOWNLOADER__GAMDL__COOKIES_PATH:-/app/data/cookies.txt}"
        DOWNLOADER__YTDLP__COOKIES_PATH: "${DOWNLOADER__YTDLP__COOKIES_PATH:-/app/data/cookies.txt}"
      volumes:
        - "${BOT_DATA_PATH:-./data/bot}:/app/data/"
      restart: unless-stopped
      networks:
        - telegram-net

networks:
  telegram-net:
    driver: bridge