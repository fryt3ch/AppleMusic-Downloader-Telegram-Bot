services:
    telegram-bot-api:
      container_name: telegram-bot-api
      image: aiogram/telegram-bot-api:latest
      profiles: ["local-api"]
      environment:
        TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
        TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
        TELEGRAM_STAT: "${TELEGRAM_STAT:-1}"
        TELEGRAM_VERBOSITY: "${TELEGRAM_VERBOSITY:-0}"
      volumes:
        - "${TG_DATA_PATH:-./data/telegram}:/var/lib/telegram-bot-api"
      restart: unless-stopped
      networks:
        - telegram-net

    applemusic-bot:
      container_name: applemusic-bot
      build:
        context: .
        dockerfile: Dockerfile
      image: local/applemusic_tg_bot:latest
      hostname: tgbot
      depends_on:
        telegram-bot-api:
          condition: service_started
          required: false
      user: "1000:1000"
      environment:
        LOGGING__LOGLEVEL__DEFAULT: "${LOGGING__LOGLEVEL__DEFAULT:-Debug}"
        TELEGRAM__BOT_TOKEN: "${TELEGRAM__BOT_TOKEN}"
        # If you launch profile 'local-api' then put to .env: TELEGRAM__SERVER_API_URL=http://telegram-bot-api:8081
        TELEGRAM__SERVER_API_URL: "${TELEGRAM__SERVER_API_URL:-https://api.telegram.org}"
        TELEGRAM__WEBHOOK__ENABLED: "${TELEGRAM__WEBHOOK__ENABLED:-false}"
        TELEGRAM__WEBHOOK__URL: "${TELEGRAM__WEBHOOK__URL}"
        TELEGRAM__WEBHOOK__MAX_CONNECTIONS: "${TELEGRAM__WEBHOOK__MAX_CONNECTIONS:-50}"
        TELEGRAM__STORAGE_CHAT_ID: "${TELEGRAM__STORAGE_CHAT_ID}"
        APPLE_MUSIC_DOWNLOADER__COOKIES_PATH: "${APPLE_MUSIC_DOWNLOADER__COOKIES_PATH:-/app/data/cookies.txt}"
        APPLE_MUSIC__DEFAULT_STORE: "${APPLE_MUSIC__DEFAULT_STORE:-us}"
        APPLE_MUSIC__API_TOKEN: "${APPLE_MUSIC__API_TOKEN}"
      volumes:
        - "${BOT_DATA_PATH:-./data/bot}:/app/data/"
      restart: unless-stopped
      networks:
        - telegram-net

networks:
  telegram-net:
    driver: bridge